name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pytest
        run: pytest

      - name: Smoke ConvFrameEX
        run: >
          python scripts/ConvFrameEX.py
          --size 16 --patch 4
          --experiment reconstruction
          --images data/boat.png
          --out-dir /tmp/cf_smoke
